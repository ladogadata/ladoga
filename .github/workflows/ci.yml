name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t ladoga:ci .
      - name: Start container
        run: |
          docker run -d --name ladoga -p 8000:8000 \
            -e LADOGA_ADMIN_USERNAME=admin \
            -e LADOGA_ADMIN_PASSWORD=ci-password \
            -e LADOGA_SECRET_KEY=ci-secret \
            ladoga:ci
      - name: Check API and UI
        run: |
          for i in $(seq 1 30); do curl -fs http://localhost:8000/api/health && break; sleep 1; done
          curl -fs http://localhost:8000/api/health
          curl -fs http://localhost:8000/ | grep -q '<div id="root">'
      - if: failure()
        run: docker logs ladoga

  publish:
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ladogadata/ladoga:latest
            ghcr.io/ladogadata/ladoga:${{ github.sha }}