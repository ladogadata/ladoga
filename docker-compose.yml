services:
  ladoga:
    build:
      context: .
      target: dev
    image: local/ladoga:dev
    container_name: ladoga
    env_file: .env
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - ./backend/app:/app/app      # live code reload without rebuilding
      - ./backend/tests:/app/tests
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    image: node:24
    container_name: ladoga-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app             # node_modules lands in frontend/, so the IDE can see it
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:15173:5173"
    depends_on:
      - ladoga
    restart: unless-stopped